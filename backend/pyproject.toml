[project]
name = "biomarx"
version = "0.1.0"
description = "Chronobiology and physiology observatory for Apple Health exports"
authors = [
    { name = "Vasu Kandagatla" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=2.0.0",
    "fastapi>=0.162.2",
    "numpy>=2.5.4",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.3",
    "python-multipart>=0.0.33",
    "scipy>=1.18.1",
    "typer>=0.28.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
biomarx = "biomarx.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 160
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
